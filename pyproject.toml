[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-activity"
version = "1.0.0"
description = "Локальная история сделок с планами, группировкой позиций и отчётом по месяцам и дням"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask==3.1.1",
    "requests==2.32.4",
    "truststore==0.10.4",
]

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]

[project.optional-dependencies]
dev = ["ruff==0.16.9"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
